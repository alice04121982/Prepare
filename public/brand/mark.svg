<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#141414">
  <!-- The Stay Prepared mark: four square-ended bars crossing at 45 degrees. -->
  <g transform="translate(50 50)">
    <rect x="-9" y="-46" width="18" height="92"/>
    <rect x="-9" y="-46" width="18" height="92" transform="rotate(45)"/>
    <rect x="-9" y="-46" width="18" height="92" transform="rotate(90)"/>
    <rect x="-9" y="-46" width="18" height="92" transform="rotate(135)"/>
  </g>
</svg>
