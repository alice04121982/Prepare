<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay Prepared: four directions</title>
<style>
  :root { --ink: #111; --muted: #555; --line: #ddd; --bg: #f4f4f2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { padding: 24px 24px 8px; max-width: 1800px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; padding: 24px; max-width: 1800px; margin: 0 auto; }
  figure { margin: 0; }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  figcaption strong { font-size: 18px; }
  figcaption a { color: #0b57a4; text-underline-offset: 3px; }
  iframe { display: block; width: 390px; max-width: 100%; height: 780px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Stay Prepared: four homepage directions</h1>
  <p>Same copy in each, shown at phone width (390px). Scroll inside each frame, or open one full size to see the desktop layout.</p>
</header>
<main class="grid">
  <figure>
    <figcaption><strong>A. Own-label larder</strong><a href="a-larder.html">Open full size</a></figcaption>
    <iframe src="a-larder.html" title="Direction A, own-label larder"></iframe>
  </figure>
  <figure>
    <figcaption><strong>B. Recipe for three days</strong><a href="b-recipe.html">Open full size</a></figcaption>
    <iframe src="b-recipe.html" title="Direction B, recipe for three days"></iframe>
  </figure>
  <figure>
    <figcaption><strong>C. Shipping forecast</strong><a href="c-forecast.html">Open full size</a></figcaption>
    <iframe src="c-forecast.html" title="Direction C, shipping forecast"></iframe>
  </figure>
  <figure>
    <figcaption><strong>D. The standard, played straight</strong><a href="d-standard.html">Open full size</a></figcaption>
    <iframe src="d-standard.html" title="Direction D, the standard"></iframe>
  </figure>
</main>
</body>
</html>
